<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    
<div class="parent-dashboard">
    <div class="sidePanel">
        <h2>ContentCreator</h2>
        <ul>
        <li>
            Dashboard
        </li>
        <li>
            Calendar
        </li>
        <li>
            Scripts
        </li>
        <li>
            Analytics
        </li>
    </ul>

    </div>
    
    
    <div class="topPanel">
        <h2>Dashboard</h2>
    </div>
    
    <div class="div3">
        Followers
    </div>
    
    <div class="div4">
        YouTube
    </div>
    
    <div class="div5">
        TikTok
    </div>
    
    <div class="div6">
        Instagram
    </div>
    
    <div class="div7">
        Impressions
    </div>
    
    <div class="div8">
        Posts
    </div>
    
    <div class="div9">
        <button id="addScriptBtn">
            + Add Script
        </button>
    </div>
    
    <div class="div10">
        Line graph
    </div>
    
    <div class="div11">
        Bar graph
    </div>
    
    <div class="div12">
        Pie chart
    </div>


    <div id="scriptForm" style="display:none;">

    <input type="text" id="scriptInput" placeholder="Write your script idea">
    
    <button id="saveScript">Save</button>
    </div>

<div id="scriptList"></div>

</div>
    
<script src="script.js"></script>
</body>
</html>
